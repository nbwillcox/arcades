<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nic's Arcade">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Nic's Arcade</title>
<meta name="description" content="Nic's Arcade - 30 free neon space arcade games in one place. Pick a cabinet with a controller, keyboard, mouse or touch.">
<link rel="stylesheet" href="css/arcade.css?v=2">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main id="hub">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="n">NIC'S</span><span class="a">ARCADE</span></div>
      <div class="sub"><span id="count">30</span> CABINETS ONLINE</div>
    </div>
    <nav id="tabs" role="tablist" aria-label="Game categories"></nav>
    <div class="status">
      <span id="padChip" class="chip" title="Controller">PAD <i></i></span>
      <button id="muteBtn" class="chip btn" title="Sound (M)">SND <i></i></button>
      <button id="afsBtn" class="chip btn" title="Go full screen automatically when a game starts">AUTO FS <i></i></button>
      <button id="fsBtn" class="chip btn" title="Full screen (F)">FULL</button>
    </div>
  </header>

  <section class="body">
    <div id="gridWrap"><div id="grid" role="listbox" aria-label="Games"></div></div>
    <aside id="spot" aria-live="polite">
      <div class="art"><img id="spImg" alt=""><div class="shine"></div></div>
      <div class="meta">
        <div id="spGenre" class="genre"></div>
        <h2 id="spName"></h2>
        <p id="spTag"></p>
        <ul id="spKeys"></ul>
        <div id="spBadges" class="badges"></div>
      </div>
      <button id="spPlay" class="play"><span>PLAY</span></button>
    </aside>
  </section>

  <footer class="hints" id="hints">
    <span><b>D-PAD</b> Select</span><span><b>A</b> Play</span><span><b>LB RB</b> Category</span>
    <span><b>Y</b> Favorite</span><span><b>X</b> Random</span>
    <span class="tk">In a game: tap the <b>glowing bar</b> at the top for the Arcade menu</span>
    <span class="kb">In a game: <b>`</b> or <b>Select+Start</b> = Arcade menu</span>
  </footer>
</main>

<div id="stage" hidden>
  <iframe id="frame" title="Game" allow="fullscreen; gamepad; autoplay; pointer-lock; accelerometer; gyroscope"></iframe>
  <button id="tab" aria-label="Arcade menu"><span></span></button>
</div>

<div id="launch" hidden><div class="ring"></div><div id="lName"></div><div class="bar"><i></i></div></div>

<div id="pause" hidden role="dialog" aria-label="Arcade menu">
  <div class="card">
    <div class="ptitle" id="pName"></div>
    <div id="pMenu"></div>
    <div id="holdMsg"></div>
  </div>
</div>

<div id="toast"></div>
<noscript><p style="color:#fff;padding:2em">Nic's Arcade needs JavaScript.</p></noscript>
<script src="js/catalog.js?v=2"></script>
<script src="js/stars.js?v=1"></script>
<script src="js/sfx.js?v=1"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
